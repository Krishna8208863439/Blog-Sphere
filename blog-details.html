<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Read a story on BlogSphere.">
  <title>Story — BlogSphere</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Outfit:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="details">

  <!-- Skip link -->
  <a class="skip-link" href="#article-root">Skip to article</a>

  <!-- Page loader -->
  <div id="page-loader" class="page-loader" aria-hidden="true">
    <div class="loader-mark"><span></span><p>Loading…</p></div>
  </div>

  <!-- No-JS warning -->
  <noscript>
    <p class="noscript">BlogSphere requires JavaScript. Please enable it in your browser settings.</p>
  </noscript>

  <!-- Header -->
  <header id="site-header" class="site-header" role="banner"></header>

  <!-- Main -->
  <main id="main-content">
    <div class="article-wrap">

      <!-- Article content (injected by blogs.js) -->
      <article id="article-root" role="article" aria-label="Story content"></article>

      <!-- Related stories -->
      <section id="related-section" aria-labelledby="related-title" hidden>
        <div class="section-head" style="margin-top:2.5rem;">
          <h2 id="related-title">More in this category</h2>
        </div>
        <div class="card-grid" id="related-grid"></div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer id="site-footer" class="site-footer" role="contentinfo"></footer>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/blogs.js"></script>
</body>
</html>
